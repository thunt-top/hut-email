name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "hut-email:${{ github.ref_name }}" .

      - name: Save image
        run: docker save "hut-email:${{ github.ref_name }}" | gzip > "hut-email-${{ github.ref_name }}.tar.gz"

      - name: Create release and upload image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "hut-email-${{ github.ref_name }}.tar.gz" \
            --title "${{ github.ref_name }}" \
            --generate-notes
